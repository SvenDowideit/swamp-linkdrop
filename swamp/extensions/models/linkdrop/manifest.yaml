manifestVersion: 1
name: "@svendowideit/linkdrop"
version: "2026.10.27.2"
description: >
  Durable SQLite inbox for URLs shared by the LinkDrop Android app.

  WHAT IT DOES

    Receives the JSON body from the LinkDrop Android share app and stores each
    URL in a local SQLite database. The Android app only needs one endpoint;
    this behavior is the durable inbox behind it, idempotent by share UUID, so
    app retries do not create duplicate rows. It is independent of swamp data
    retention and can be queried with any SQLite tool, while the bundled
    `@svendowideit/linkdrop-setup` workflow creates the Caddy DNS/TLS route for
    the existing `swamp serve` webhook.

  INSTALL

      swamp extension pull @svendowideit/linkdrop

    One pull installs the behavior and both bundled workflows:
    `@svendowideit/linkdrop-setup` (Caddy DNS/TLS) and
    `@svendowideit/capture-linkdrop` (webhook handler).

  DEPENDENCIES

    The bundled `@svendowideit/linkdrop-setup` workflow requires
    @svendowideit/caddy (pulled automatically as a dependency) and assumes
    `swamp serve` is already configured with the `/hooks/linkdrop` webhook
    route. Pulling the dependency installs the type, not a configured Caddy
    model: create/configure one and pass `--input caddyModel=<its-name>` if it
    is not named `caddy`. The SQLite behavior itself has no runtime dependency.

  RUN

      # Store one share manually; the webhook workflow does this automatically.
      swamp model @svendowideit/linkdrop method run store linkdrop \
        --input url="https://example.com/article"

      # Inspect the newest rows and the total count.
      swamp model @svendowideit/linkdrop method run list linkdrop
      swamp model @svendowideit/linkdrop method run stats linkdrop

      # Create the DNS A record and TLS route through the bundled workflow.
      # If your Caddy model is not named `caddy`, add --input caddyModel=<name>.
      swamp workflow run @svendowideit/linkdrop-setup \
        --input dnsName=linkdrop.example.com

  CONFIGURE

    Global argument `dbPath` controls the SQLite file. Empty uses
    `$SWAMP_HOME/linkdrop/links.db` (falling back to
    `~/.swamp/linkdrop/links.db`). Set it at model creation or edit an existing
    definition:

      # Point the inbox at a specific SQLite file.
      swamp model create @svendowideit/linkdrop linkdrop \
        --global-arg dbPath=~/.swamp/linkdrop/links.db

  UPGRADE

    This behavior installs nothing on the host. Update the pulled extension with
    `swamp extension update @svendowideit/linkdrop`; the SQLite file is
    untouched.

  WHAT IT INSTALLS

    Nothing on the host: no services, cron triggers, daemons, or webhooks. It
    writes a SQLite database and swamp resources. It ships two workflows:
    `@svendowideit/linkdrop-setup` creates a Caddy route and DNS/TLS entry for
    the existing swamp serve webhook, and `@svendowideit/capture-linkdrop` is
    the workflow that webhook runs. It installs no services or cron triggers.

repository: https://github.com/svendowideit/linkdrop

license: MIT

paths:
  base: manifest

models:
  - linkdrop.ts

workflows:
  - linkdrop-setup.yaml
  - capture-linkdrop.yaml


dependencies:
  - "@svendowideit/caddy"

additionalFiles:
  - README.md
  - LICENSE.txt
  - linkdrop_test.ts
  - serve.example.yaml

platforms: []
